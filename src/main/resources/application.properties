spring.application.name=backend

# 로컬 비밀값(.env, git 제외)을 설정으로 읽는다. 운영은 환경변수로 주입한다.
spring.config.import=optional:file:.env[.properties]

# DB 접속 정보는 환경변수로 주입. 로컬에서는 compose.yaml이 자동 연결한다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oppskin}
spring.datasource.username=${DB_USERNAME:oppskin}
spring.datasource.password=${DB_PASSWORD:oppskin-local}

# 스키마는 Flyway 마이그레이션으로만 관리한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 프론트엔드 주소 (로그인 후 이동, CORS 허용)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 카카오 로그인 (키는 .env 또는 환경변수)
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 로그인 세션: DB(spring_session 테이블, Flyway V3)에 저장해 서버 여러 대에서 공유한다.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health
springdoc.api-docs.path=/v3/api-docs
