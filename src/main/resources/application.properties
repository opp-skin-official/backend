spring.application.name=backend

# DB 접속 정보는 환경변수로 주입. 로컬에서는 compose.yaml이 자동 연결한다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oppskin}
spring.datasource.username=${DB_USERNAME:oppskin}
spring.datasource.password=${DB_PASSWORD:oppskin-local}

# 스키마는 Flyway 마이그레이션으로만 관리한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 프론트엔드 개발 서버 주소 (CORS 허용)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
springdoc.api-docs.path=/v3/api-docs
