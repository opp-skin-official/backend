# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod). 값은 환경변수·AWS Secrets Manager로 주입한다.

# 로드밸런서(HTTPS 종료) 뒤에서 X-Forwarded-* 를 믿어, 카카오 리다이렉트 주소를 https로 만든다.
# native = Tomcat RemoteIpValve. 사설망(10.x, 172.16-31.x, 192.168.x) 프록시의 헤더만 믿는다(ALB는 VPC 사설 IP).
# framework 방식은 로컬 검증에서 OAuth 리다이렉트 주소에 반영되지 않아 쓰지 않는다.
server.forward-headers-strategy=native

# 쿠키: HTTPS 전용, 상위 도메인(예: .example.com)으로 공유해 app.·api. 서브도메인에서 함께 쓴다.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.domain=${COOKIE_DOMAIN}
app.cookie.secure=true
app.cookie.domain=${COOKIE_DOMAIN}

# 운영에는 docker compose가 없다.
spring.docker.compose.enabled=false

# API 문서는 운영에서 끈다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
