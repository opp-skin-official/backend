# 서버에 이미 있는 api.opp.skin 의 443 server 블록 안에 넣는다 (인증서 설정은 그대로 둔다).
# 백엔드는 X-Forwarded-* 를 보고 카카오 리다이렉트 주소를 https://api.opp.skin/... 로 만든다.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # AI 모델 응답이 길게 걸릴 수 있다 (Model A/B 최대 300초)
    proxy_read_timeout 310s;
    # 채팅 답변(SSE)을 모으지 않고 바로 흘려보낸다. 백엔드도 X-Accel-Buffering: no를 보낸다.
    proxy_buffering off;
    client_max_body_size 20m;
}
