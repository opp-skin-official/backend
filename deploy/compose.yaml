# 운영 서버(EC2, api.opp.skin)용. 서버의 /opt/oppskin 에 이 파일과 .env를 둔다.
# 외부 요청은 서버에 이미 있는 nginx(HTTPS, Let's Encrypt)가 받아 127.0.0.1:8080으로 넘긴다.
# DB는 RDS PostgreSQL(자동 백업, 서버와 분리). 접속 정보(DB_URL·DB_USERNAME·DB_PASSWORD)는 .env에서 받는다.
name: oppskin

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/opp-skin-official/backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # .env에 없으면 시작하지 않는다 (예전처럼 서버 안 DB로 조용히 붙지 않게)
      DB_URL: ${DB_URL:?DB_URL을 .env에 넣어 주세요 (RDS 엔드포인트)}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 넣어 주세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
    # 서버 안에서만 열어 nginx만 접근하게 한다.
    ports:
      - "127.0.0.1:8080:8080"

  # RDS 없이 서버 안 컨테이너 DB로 돌릴 때만: COMPOSE_PROFILES=local-db 이고 .env의 DB_URL=jdbc:postgresql://db:5432/oppskin
  db:
    profiles: ["local-db"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: oppskin
      POSTGRES_USER: ${DB_USERNAME:-oppskin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d oppskin"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 포트를 열지 않는다: 백엔드 컨테이너만 접근한다.

volumes:
  pgdata:
